# Builds and tests on Linux, macOS and Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
          - os: ubuntu-latest
            cxx: clang++
          - os: macos-latest
            cxx: clang++
          - os: windows-latest
            cxx: g++

    steps:
      - uses: actions/checkout@v4

      - name: Show compiler version
        run: ${{ matrix.cxx }} --version

      - name: Build
        run: make CXX=${{ matrix.cxx }}

      - name: Run unit tests
        run: make test CXX=${{ matrix.cxx }}

      - name: A transfer conserves money and persists exactly
        shell: bash
        run: |
          # Drive the scriptable command mode, one operation per invocation.
          ./bank --db ci_bank.txt open Ada 100
          ./bank --db ci_bank.txt open Bob 0
          ./bank --db ci_bank.txt deposit 1001 50.50
          ./bank --db ci_bank.txt transfer 1001 1002 30
          echo "--- stored data ---"
          cat ci_bank.txt
          # Ada: 100 + 50.50 - 30 = 120.50 -> 12050 minor units on her ACCOUNT line.
          grep -q $'ACCOUNT\t1001\t12050\t' ci_bank.txt \
            || { echo "FAIL: Ada's persisted balance is wrong"; exit 1; }
          # Bob received 30.00 -> 3000 minor units.
          grep -q $'ACCOUNT\t1002\t3000\t' ci_bank.txt \
            || { echo "FAIL: Bob's persisted balance is wrong"; exit 1; }
          echo "OK: balances persisted exactly as integer minor units"

      - name: An overdrawn withdrawal is refused
        shell: bash
        run: |
          ./bank --db ci_bank2.txt open Ada 10
          # The command must fail (non-zero exit) and say why.
          if ./bank --db ci_bank2.txt withdraw 1001 999; then
            echo "FAIL: an overdraft was not refused"; exit 1
          fi
          echo "OK: overdraft refused"

      - name: A tampered data file is rejected on load
        shell: bash
        run: |
          # A balance that does not match the ledger must fail the integrity check.
          printf 'ACCOUNT\t1001\t99999\t1\tMallory\nENTRY\tOPEN\t100\t100\t0\topened\n' > tampered.txt
          if ./bank --db tampered.txt list; then
            echo "FAIL: a tampered ledger was accepted"; exit 1
          fi
          echo "OK: tampered ledger rejected"
